name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Validate and package teacher simulator
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Validate Python syntax
        shell: pwsh
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('teacher_sim.py').read_text(encoding='utf-8-sig')); print('teacher_sim.py: syntax OK')"

      - name: Package teacher simulator
        shell: pwsh
        run: ./scripts/build-teacher-sim.ps1

      - name: Upload teacher simulator
        uses: actions/upload-artifact@v4
        with:
          name: teacher-simulator
          path: Release/teacher_sim.exe
          if-no-files-found: error

  native:
    name: Build native application (x86 Release)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Locate Windows Driver Kit
        shell: pwsh
        run: |
          $kit = "${env:ProgramFiles(x86)}\\Windows Kits\\10"
          $version = Get-ChildItem "$kit\\Include" -Directory |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $_.FullName 'km\\ntddk.h')) -and
              (Test-Path -LiteralPath "$kit\\Lib\\$($_.Name)\\km\\x86\\ntoskrnl.lib") -and
              (Test-Path -LiteralPath "$kit\\Lib\\$($_.Name)\\km\\x86\\BufferOverflowK.lib")
            } |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $version) { throw 'Windows Driver Kit is required but was not found on the runner.' }
          "WDK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using Windows Driver Kit $version"

      - name: Build driver
        run: msbuild JiYuTrainerDriver/JiYuTrainerDriver.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=$env:WDK_VERSION

      - name: Build application projects
        run: |
          msbuild JiYuTrainerHooks/JiYuTrainerHooks.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0.19041.0
          msbuild JiYuTrainerUI/JiYuTrainerUI.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0.19041.0
          msbuild JiYuTrainerUpdater/JiYuTrainerUpdater.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0.19041.0
          msbuild JiYuTrainer/JiYuTrainer.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0.19041.0

      - name: Verify native package inputs
        shell: pwsh
        run: |
          $required = @('Release/学习不通.exe', 'Release/JiYuTrainerDriver.sys', 'Release/JiYuTrainerHooks.dll', 'Release/sciter.zip')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) { throw "Build did not produce all required package inputs: $($missing -join ', ')" }

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: native-x86-release
          path: |
            Release/学习不通.exe
            Release/JiYuTrainerDriver.sys
            Release/JiYuTrainerHooks.dll
            Release/sciter.zip
          if-no-files-found: error

  package:
    name: Assemble x86 release package
    needs: [python, native]
    runs-on: windows-2022
    steps:
      - name: Download package components
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: Release

      - name: Verify complete release package
        shell: pwsh
        run: |
          $required = @('Release/学习不通.exe', 'Release/teacher_sim.exe', 'Release/JiYuTrainerDriver.sys', 'Release/JiYuTrainerHooks.dll', 'Release/sciter.zip')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) { throw "Release package is incomplete: $($missing -join ', ')" }

      - name: Upload complete release package
        uses: actions/upload-artifact@v4
        with:
          name: release-x86
          path: Release
          if-no-files-found: error
