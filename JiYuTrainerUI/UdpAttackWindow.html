<html>
<head>
    <style>
        html {
            background: transparent; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", Tahoma, sans-serif;
            margin: 15px;
            padding: 0;
        }
        h2 {
            text-align: center;
            padding-top: 0;
            margin-top: 0;
        }
        .info-bar {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #856404;
        }
        .form-row {
            margin-bottom: 10px;
        }
        .form-row label {
            display: inline-block;
            width: 80px;
            font-size: 13px;
            color: #333;
        }
        .form-row input[type="text"], .form-row select {
            width: 200px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        .form-row input[type="text"].small {
            width: 80px;
        }
        .btn-row {
            text-align: center;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            color: #fff;
            background-color: #37b0ff;
            padding: 6px 18px;
            border-radius: 5px;
            font-size: 13px;
            margin: 0 4px;
            cursor: pointer;
        }
        .btn:hover { background-color: #1e9eff; }
        .btn-danger { background-color: #ff6b6b; }
        .btn-danger:hover { background-color: #ff5252; }
        .log-box {
            background-color: #f8f9fa;
            color: #212529;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            font-family: Consolas, "Courier New", monospace;
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }
        .log-box .log-info { color: #0066cc; }
        .log-box .log-ok { color: #1a7f37; font-weight: bold; }
        .log-box .log-err { color: #cf222e; font-weight: bold; }

        /* ===== Liquid Glass (QD_V1.2_LiquidGlass-Test) ===== */
        body {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.5);
        }
        .info-bar {
            background: rgba(232, 244, 253, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(184, 218, 255, 0.5);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn {
            background: rgba(55, 176, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 190, 255, 0.5);
            box-shadow: 0 4px 14px rgba(55, 176, 255, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn:hover {
            background: rgba(30, 158, 255, 0.85);
            box-shadow: 0 6px 20px rgba(55, 176, 255, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0) scale(0.97);
        }
        .btn-green {
            background: rgba(40, 167, 69, 0.75);
            border-color: rgba(80, 200, 100, 0.5);
            box-shadow: 0 4px 14px rgba(40, 167, 69, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn-green:hover {
            background: rgba(30, 150, 60, 0.85);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        .btn-danger {
            background: rgba(255, 107, 107, 0.75);
            border-color: rgba(255, 140, 140, 0.5);
            box-shadow: 0 4px 14px rgba(255, 107, 107, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn-danger:hover {
            background: rgba(255, 82, 82, 0.85);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        input[type="text"], input[type="password"], select, textarea {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(55, 176, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(55, 176, 255, 0.12);
            outline: none;
        }
        #chat_log, .log-box, .path-box, .preview-box {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <h2>极域UDP攻击</h2>
    <div class="info-bar">
        利用极域学生端不对UDP包做身份验证的漏洞，向目标发送构造数据包。支持单IP、IP范围(192.168.1.10-50)、C段(192.168.1.1/24)。
    </div>
    <div class="form-row">
        <label>目标IP:</label>
        <input type="text" id="input_ip" placeholder="192.168.1.10 或 192.168.1.10-50 或 192.168.1.1/24" />
    </div>
    <div class="form-row">
        <label>端口:</label>
        <input type="text" id="input_port" class="small" value="4705" />
        <label style="margin-left:20px;">攻击模式:</label>
        <select id="select_mode">
            <option value="msg">发送消息</option>
            <option value="cmd">执行命令</option>
            <option value="reboot">重启</option>
            <option value="shutdown">关机</option>
        </select>
    </div>
    <div class="form-row">
        <label>内容:</label>
        <input type="text" id="input_content" placeholder="消息内容或命令，如 calc.exe" style="width:380px;" />
    </div>
    <div class="form-row">
        <label>循环次数:</label>
        <input type="text" id="input_loop" class="small" value="1" />
        <label style="margin-left:20px;">间隔(秒):</label>
        <input type="text" id="input_interval" class="small" value="5" />
    </div>
    <div class="btn-row">
        <button class="btn btn-danger" id="btn_send">开始攻击</button>
        <button class="btn" id="btn_clearlog">清空日志</button>
    </div>
    <div class="log-box" id="text_log"></div>
</body>
</html>
