<html>
<head>
    <style>
        html {
            background: transparent;
            overflow: hidden;
            overflow-y: scroll;
            vertical-scrollbar: my-v-scrollbar;
        }
        body {
            font-family: "Microsoft YaHei", Tahoma, sans-serif;
            margin: 15px;
            padding: 0;
        }

        .ip-list {
            display: block;
            font-size: 12px;
            background-color: #efefef;
            padding: 10px;
            margin: 5px;
            user-select: text;
        }
        .ip-list a {
            display: inline-block;
            text-decoration: underline;
            margin-right: 10px;
        }
        /* style block defining vertical scrollbar */
        @set my-v-scrollbar {
            .prev {
                display: none;
            }
            .next {
                display: none;
            }
            .base,
            .next-page,
            .prev-page {
                background-color: #f3f3f3;
                border: none;
            }
            .slider {
                background: #ccc;
                border-radius: 6px;
                border: 2px solid #f3f3f3;
            }
            .slider:hover {
                background: #999;
            }
            .slider:active {
                background: #888;
            }
            .base:disabled {
                background: transparent;
            }
            .base {
                width: 10px;
            }
            /* explicit declaration of its width */
            .corner {
                background: transparent;
            }
        }

        .top-form input,.top-form select {
            margin-left: 20px;
        }


        /* ===== Liquid Glass (QD_V1.2_LiquidGlass-Test) ===== */
        body {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.5);
        }
        .info-bar, .alert {
            background: rgba(232, 244, 253, 0.7) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(184, 218, 255, 0.5) !important;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn, .btn-common, button {
            background: rgba(55, 176, 255, 0.75) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 190, 255, 0.5) !important;
            box-shadow: 0 4px 14px rgba(55, 176, 255, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            color: #1a1a1a !important;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn:hover, .btn-common:hover, button:hover {
            background: rgba(30, 158, 255, 0.85) !important;
            box-shadow: 0 6px 20px rgba(55, 176, 255, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }
        .btn:active, .btn-common:active, button:active {
            transform: translateY(0) scale(0.97);
        }
        .btn-green, .btn-primary {
            background: rgba(40, 167, 69, 0.75) !important;
            border-color: rgba(80, 200, 100, 0.5) !important;
        }
        .btn-green:hover, .btn-primary:hover {
            background: rgba(30, 150, 60, 0.85) !important;
        }
        .btn-danger, .btn-dager {
            background: rgba(255, 107, 107, 0.75) !important;
            border-color: rgba(255, 140, 140, 0.5) !important;
        }
        .btn-danger:hover, .btn-dager:hover {
            background: rgba(255, 82, 82, 0.85) !important;
        }
        .btn-gray, .btn-secondary {
            background: rgba(108, 117, 125, 0.75) !important;
            border-color: rgba(140, 150, 160, 0.5) !important;
        }
        .btn-gray:hover, .btn-secondary:hover {
            background: rgba(90, 98, 104, 0.85) !important;
        }
        input[type="text"], input[type="password"], select, textarea {
            background: rgba(255, 255, 255, 0.65) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.12) !important;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.9) !important;
            border-color: rgba(55, 176, 255, 0.5) !important;
            box-shadow: 0 0 0 3px rgba(55, 176, 255, 0.12);
            outline: none;
        }
        #chat_log, .log-box, .path-box, .preview-box, .status-area {
            background: rgba(255, 255, 255, 0.55) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }
    </style>

</head>

<body>
    <div class="top-form">
        <span>本机地址: </span>
        <select id="select_address"></select>

        <br/>

        <span>开始地址: </span>
        <input id="input_start_add" width="300px" />

        <br/>

        <span>结束地址: </span>
        <input id="input_end_add" width="300px" />

        <br/>

        <button id="btn_refresh_ip_list" style="margin: 10px 0;">开始扫描主机IP</button>
        <span style="margin: 10px 0;">点击IP地址可复制到剪贴板</span>
    </div>

    <div class="ip-list" id="ip_list">
        请点击上方按钮开始扫描局域网内主机IP
    </div>
   
    <script type="text/tiscript">
        function self.ready()
        {
            view.docunmentComplete();
        }
    </script>
</body>
</html>
