<html>
<head>
    <style>
        html {
            background: transparent; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", Tahoma, sans-serif;
            margin: 15px;
            padding: 0;
        }
        h2 {
            text-align: center;
            padding-top: 0;
            margin-top: 0;
        }
        .info-bar {
            background-color: #e8f4fd;
            border: 1px solid #b8daff;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #004085;
        }
        .path-box {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            min-height: 20px;
        }
        .btn-row {
            text-align: center;
            margin-bottom: 12px;
        }
        .btn {
            display: inline-block;
            
            color: #fff;
            background-color: #37b0ff;
            padding: 6px 18px;
            border-radius: 5px;
            font-size: 13px;
            margin: 0 4px;
            cursor: pointer;
        }
        .btn:hover { background-color: #1e9eff; }
        .btn-danger { background-color: #ff6b6b; }
        .btn-danger:hover { background-color: #ff5252; }
        .preview-box {
        text-align: center;
        margin-bottom: 12px;
        min-height: 40px;
    }
    .status {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        /* ===== Liquid Glass (QD_V1.2_LiquidGlass-Test) ===== */
        body {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.5);
        }
        .info-bar {
            background: rgba(232, 244, 253, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(184, 218, 255, 0.5);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn {
            background: rgba(55, 176, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 190, 255, 0.5);
            box-shadow: 0 4px 14px rgba(55, 176, 255, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn:hover {
            background: rgba(30, 158, 255, 0.85);
            box-shadow: 0 6px 20px rgba(55, 176, 255, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0) scale(0.97);
        }
        .btn-green {
            background: rgba(40, 167, 69, 0.75);
            border-color: rgba(80, 200, 100, 0.5);
            box-shadow: 0 4px 14px rgba(40, 167, 69, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn-green:hover {
            background: rgba(30, 150, 60, 0.85);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        .btn-danger {
            background: rgba(255, 107, 107, 0.75);
            border-color: rgba(255, 140, 140, 0.5);
            box-shadow: 0 4px 14px rgba(255, 107, 107, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn-danger:hover {
            background: rgba(255, 82, 82, 0.85);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        input[type="text"], input[type="password"], select, textarea {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(55, 176, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(55, 176, 255, 0.12);
            outline: none;
        }
        #chat_log, .log-box, .path-box, .preview-box {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <h2>截图替换</h2>
    <div class="info-bar">
        选择一张图片后，教师端通过极域监控您的屏幕时，将显示该图片而非真实屏幕。支持 PNG / JPG / BMP 格式。
    </div>
    <div class="path-box" id="text_path">（未设置）</div>
    <div class="preview-box">
        <img id="img_preview" style="display: none; max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid #ddd;" />
    </div>
    <div class="btn-row">
        <button class="btn" id="btn_choose">选择图片</button>
        <button class="btn btn-danger" id="btn_clear" style="display: none;">清除</button>
    </div>
    <div class="btn-row">
        <button class="btn" id="btn_apply" style="background-color: #28a745;">应用</button>
        <button class="btn" id="btn_cancel" style="background-color: #6c757d;">取消</button>
    </div>
    <div class="status" id="text_status"></div>
</body>
</html>
