<html>
<head>
    <style>
        html { overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", Tahoma, sans-serif;
            margin: 15px;
            padding: 0;
        }
        h2 {
            text-align: center;
            padding-top: 0;
            margin-top: 0;
        }
        .info-bar {
            background-color: #e8f4fd;
            border: 1px solid #b8daff;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #004085;
        }
        .path-box {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            min-height: 20px;
        }
        .btn-row {
            text-align: center;
            margin-bottom: 12px;
        }
        .btn {
            display: inline-block;
            
            color: #fff;
            background-color: #37b0ff;
            padding: 6px 18px;
            border-radius: 5px;
            font-size: 13px;
            margin: 0 4px;
            cursor: pointer;
        }
        .btn:hover { background-color: #1e9eff; }
        .btn-danger { background-color: #ff6b6b; }
        .btn-danger:hover { background-color: #ff5252; }
        .preview-box {
        text-align: center;
        margin-bottom: 12px;
        min-height: 40px;
    }
    .status {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h2>截图替换</h2>
    <div class="info-bar">
        选择一张图片后，教师端通过极域监控您的屏幕时，将显示该图片而非真实屏幕。支持 PNG / JPG / BMP 格式。
    </div>
    <div class="path-box" id="text_path">（未设置）</div>
    <div class="preview-box">
        <img id="img_preview" style="display: none; max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid #ddd;" />
    </div>
    <div class="btn-row">
        <button class="btn" id="btn_choose">选择图片</button>
        <button class="btn btn-danger" id="btn_clear" style="display: none;">清除</button>
    </div>
    <div class="btn-row">
        <button class="btn" id="btn_apply" style="background-color: #28a745;">应用</button>
        <button class="btn" id="btn_cancel" style="background-color: #6c757d;">取消</button>
    </div>
    <div class="status" id="text_status"></div>
</body>
</html>
